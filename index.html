<html lang="en">
<head>

<style>
:root{--bg:#f7eef3;--panel:rgba(255,255,255,.76);--panel2:#fffafd;--ink:#5d4553;--muted:#99828e;--line:rgba(87,61,76,.11);--accent:#d995b3;--soft:#f7dce8;--soft2:#efe5ea;--shadow:0 22px 65px rgba(92,56,75,.12)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 3%,var(--soft),transparent 28%),radial-gradient(circle at 94% 8%,var(--soft2),transparent 32%),linear-gradient(145deg,#fff,#f7eef3);transition:.3s}
body[data-theme=lely]{--bg:#f8dfeb;--panel:rgba(255,249,252,.82);--panel2:#fff9fc;--ink:#74495d;--muted:#9f7d8b;--accent:#dc94b3;--soft:#f8d6e5;--soft2:#f3c8da}
body[data-theme=rand]{--bg:#111c2d;--panel:rgba(20,32,52,.86);--panel2:#17253b;--ink:#f5f1ec;--muted:#b9c1d0;--line:rgba(255,255,255,.1);--accent:#a9b7ce;--soft:#263a59;--soft2:#3c2637;--shadow:0 24px 70px rgba(0,0,0,.3);background:radial-gradient(circle at 9% 3%,#263a59,transparent 30%),radial-gradient(circle at 95% 7%,#3d2335,transparent 30%),#0f1929}
body[data-theme=renad]{--bg:#def2ee;--panel:rgba(249,255,253,.83);--panel2:#fbfffe;--ink:#366d6d;--muted:#749797;--accent:#75b9b3;--soft:#d1eee7;--soft2:#f0e8da}
body[data-theme=munira]{--bg:#f0e2df;--panel:rgba(255,250,247,.84);--panel2:#fff9f6;--ink:#7b5a58;--muted:#9b817d;--accent:#c7a267;--soft:#efd8d7;--soft2:#f5ead9}
button,input{font:inherit}.glass{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;max-width:1500px;margin:auto;padding:22px;min-height:100vh}.side{position:sticky;top:22px;height:calc(100vh - 44px);padding:22px;border-radius:32px;display:flex;flex-direction:column}.brand{font:700 33px/1 "Cormorant Garamond",serif}.brand span{color:var(--accent)}.clock{font:700 52px/1 "Cormorant Garamond",serif;margin-top:28px;letter-spacing:-.04em}.date{font-size:12px;color:var(--muted);margin-top:4px}.daypill{display:inline-block;margin-top:12px;padding:7px 10px;border-radius:999px;background:var(--soft);font-size:10px;font-weight:800}.nav{display:grid;gap:7px;margin-top:25px}.nav button{border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:14px;text-align:left;cursor:pointer}.nav button.active,.nav button:hover{background:var(--soft);color:var(--ink)}.quote{margin-top:auto;padding:15px;border-radius:18px;background:linear-gradient(135deg,var(--soft),transparent);font:600 18px/1.1 "Cormorant Garamond",serif}.switch{margin-top:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:13px;padding:10px;cursor:pointer;font-size:11px}
main{min-width:0}.group{padding:20px;border-radius:28px;margin-bottom:18px;position:relative;overflow:hidden}.group:after{content:"♡";position:absolute;right:-15px;top:-55px;font:700 160px "Cormorant Garamond";color:var(--soft);opacity:.5}.grouphead{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;position:relative;z-index:1}.eyebrow{font-size:9px;letter-spacing:.16em;font-weight:800;color:var(--muted)}h1,h2,h3{font-family:"Cormorant Garamond",serif}.group h2{font-size:38px;line-height:1;margin:6px 0}.group p{margin:0;color:var(--muted);font-size:11px}.bigscore{text-align:right;white-space:nowrap}.bigscore strong{display:block;font:700 30px/1 "Cormorant Garamond"}.heart{display:flex;gap:3px;flex-wrap:wrap}.heart span{color:color-mix(in srgb,var(--muted) 35%,transparent);font-size:17px}.heart span.on{color:var(--accent)}.heart.big span{font-size:22px}.girls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px;position:relative;z-index:1}.girl{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:17px;padding:12px;text-align:left;cursor:pointer}.girl:hover{transform:translateY(-2px)}.girltop,.girlmeta{display:flex;justify-content:space-between;gap:8px;align-items:center}.girltop strong{font-size:15px}.girlmeta{font-size:9px;color:var(--muted);margin-top:8px}.clubstats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:11px;position:relative;z-index:1}.clubstat{background:var(--soft);border-radius:14px;padding:10px 12px;display:flex;align-items:baseline;justify-content:space-between}.clubstat strong{font:700 22px/1 "Cormorant Garamond"}.clubstat span{font-size:8px;font-weight:800;color:var(--muted);text-transform:uppercase}.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;position:relative;z-index:1}.badge{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:7px 9px;font-size:9px;color:var(--muted)}.perfect{margin-top:10px;background:linear-gradient(90deg,var(--soft),var(--panel2),var(--soft));padding:11px;border-radius:15px;text-align:center;font:700 17px "Cormorant Garamond";position:relative;z-index:1}
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.heroCard,.card{border-radius:28px;padding:24px}.heroCard{min-height:330px;position:relative;overflow:hidden}.heroCard h1{font-size:clamp(50px,7vw,88px);line-height:.83;letter-spacing:-.04em;margin:12px 0 14px;max-width:720px}.heroCard p{max-width:580px;color:var(--muted);font-size:13px}.moodshape{position:absolute;right:-25px;bottom:-40px;width:300px;height:300px;border-radius:48% 52% 22% 78%;background:radial-gradient(circle at 30% 25%,var(--panel2),var(--accent));opacity:.7;transform:rotate(15deg)}.miniStack{display:grid;gap:18px}.card h3{font-size:28px;line-height:1;margin:0}.sub{color:var(--muted);font-size:11px;margin-top:6px}.profiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.profileCard{min-height:230px;border:1px solid var(--line);border-radius:24px;padding:16px;position:relative;overflow:hidden;cursor:pointer;color:white;box-shadow:var(--shadow)}.profileCard:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 18%,rgba(0,0,0,.68))}.profileCard>*{position:relative;z-index:1}.profileCard .tag{font-size:10px;opacity:.85}.profileCard h3{font-size:29px;margin-top:145px}.profileCard .score{display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:11px}.lelyBg{background:linear-gradient(150deg,#f6aeca,#f9e4ed 48%,#b98f9f)}.randBg{background:linear-gradient(145deg,#0d1727,#223553 58%,#5a293b)}.renadBg{background:linear-gradient(145deg,#c9eee8,#73b9b5 50%,#efdcc4)}.muniraBg{background:linear-gradient(145deg,#f1cdcf,#d9bd91 50%,#8b6865)}
.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:18px}.todayCards{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:14px}.todayOne{padding:12px;border-radius:15px;border:1px solid var(--line);background:var(--panel2)}.todayOne header{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:800}.todayOne small{color:var(--muted)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row small{color:var(--muted)}.sectionTitle{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.sectionTitle h3{margin:0}.pill{padding:7px 10px;background:var(--soft);border-radius:999px;font-size:9px;font-weight:800}
.profileTop{display:grid;grid-template-columns:.95fr 1.05fr;gap:18px}.moodboard{min-height:330px;border-radius:28px;display:grid;grid-template-columns:1.25fr .75fr;gap:8px;padding:8px;overflow:hidden}.moodTile{border-radius:22px;padding:18px;display:flex;align-items:flex-end;color:white;font:700 18px "Cormorant Garamond";position:relative;overflow:hidden}.moodTile:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(0,0,0,.35))}.moodTile span{position:relative;z-index:1}.moodTile.big{grid-row:span 2}.profileInfo{border-radius:28px;padding:25px}.profileInfo h2{font-size:58px;line-height:.84;margin:10px 0}.profileStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.stat{background:var(--soft);border-radius:14px;padding:11px;text-align:center}.stat strong{display:block;font:700 23px "Cormorant Garamond"}.stat small{font-size:8px;color:var(--muted)}.adherence{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-top:18px}.adherence strong{font:700 35px/1 "Cormorant Garamond"}.streaks{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.streaks span{font-size:9px;background:var(--soft);padding:7px 9px;border-radius:999px}
.insights{display:grid;grid-template-columns:1.15fr .85fr .85fr;gap:12px;margin-top:18px}.insight{padding:16px;border-radius:20px}.insight h3{font-size:23px}.moods{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.moods button{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:7px;cursor:pointer}.moods button.active{background:var(--soft);outline:2px solid var(--accent)}.taskGrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.checks{display:grid;gap:7px}.check{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);background:var(--panel2);border-radius:14px;font-size:11px}.check input{width:18px;height:18px;accent-color:var(--accent)}.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}.daydot{padding:8px 4px;border-radius:12px;text-align:center;background:var(--panel2);border:1px solid var(--line);font-size:8px}.daydot b{display:block;font-size:11px}.daydot.today{background:var(--soft);outline:2px solid var(--accent)}
.gate{position:fixed;inset:0;z-index:99;display:grid;place-items:center;padding:18px;background:rgba(248,242,245,.86);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);opacity:0;pointer-events:none;transition:.25s}.gate.show{opacity:1;pointer-events:auto}.gatePanel{width:min(900px,100%);padding:28px;border-radius:34px}.gatePanel h1{font-size:70px;line-height:.9;margin:8px 0}.gateGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}.pick{border:1px solid var(--line);border-radius:22px;padding:12px;text-align:left;cursor:pointer;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end}.pick strong{font:700 25px "Cormorant Garamond"}.pick small{font-size:9px}.remember{display:flex;align-items:center;gap:8px;margin-top:15px;font-size:10px;color:var(--muted)}.mobileNav{display:none}.toast{position:fixed;z-index:120;left:50%;top:16px;transform:translateX(-50%) translateY(-20px);opacity:0;background:var(--panel2);border:1px solid var(--line);box-shadow:var(--shadow);padding:10px 14px;border-radius:999px;font-size:11px;font-weight:800;transition:.25s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:980px){.shell{grid-template-columns:1fr;max-width:680px;padding:14px 14px 100px}.side{display:none}.girls,.profiles{grid-template-columns:1fr 1fr}.hero,.profileTop,.taskGrid,.grid2{grid-template-columns:1fr}.insights{grid-template-columns:1fr}.mobileNav{display:flex;position:fixed;z-index:60;bottom:10px;left:50%;transform:translateX(-50%);width:min(calc(100% - 20px),650px);padding:7px;border-radius:20px;justify-content:space-around}.mobileNav button{border:0;background:transparent;color:var(--muted);border-radius:12px;padding:7px;font-size:10px}.mobileNav button.active{background:var(--soft);color:var(--ink)}.grouphead{flex-direction:column}.bigscore{text-align:left}.gateGrid{grid-template-columns:1fr 1fr}.gatePanel h1{font-size:52px}}
@media(max-width:560px){.girls,.profiles,.todayCards,.clubstats{grid-template-columns:1fr}.gatePanel{padding:17px}.gateGrid{gap:7px}.pick{min-height:130px;padding:9px}.profileInfo h2{font-size:46px}.moodboard{min-height:280px}.heart.big span{font-size:19px}.group h2{font-size:33px}}
</style>
</head>
<body data-theme="club">
<div class="toast" id="toast">Saved ♡</div>
<div class="gate" id="gate">
  <div class="gatePanel glass">
    <div class="brand">Glow Club <span>♡</span></div>
    <div class="eyebrow" style="margin-top:22px">YOUR 90-DAY WORLD</div>
    <h1>Who are you today?</h1>
    <p class="sub">Pick your profile and open your own little world.</p>
    <div class="gateGrid">
      <button class="pick lelyBg" data-pick="lely"><strong>Lujain</strong><small>the dreamer · baby pink 🎀</small></button>
      <button class="pick randBg" data-pick="rand" style="color:white"><strong>Rand</strong><small>the icon · navy luxe 🐆</small></button>
      <button class="pick renadBg" data-pick="renad" style="color:#315f60"><strong>Renad</strong><small>the explorer · seafoam 🐚</small></button>
      <button class="pick muniraBg" data-pick="munira" style="color:#6f5250"><strong>Munira</strong><small>the princess · blush gold 👑</small></button>
    </div>
    <label class="remember"><input id="remember" type="checkbox" checked> Remember me on this device ♡</label>
  </div>
</div>

<div class="shell">
<aside class="side glass">
  <div class="brand">Glow Club <span>♡</span></div>
  <div class="clock" id="clock">--:--</div>
  <div class="date" id="date"></div>
  <div class="daypill" id="daypill">Day 1 / 90</div>
  <nav class="nav">
    <button data-route="home" class="active">⌂ Home</button>
    <button data-route="lely">🎀 Lely</button>
    <button data-route="rand">🐆 Rand</button>
    <button data-route="renad">🐚 Renad</button>
    <button data-route="munira">👑 Munira</button>
  </nav>
  <div class="quote">♡ we don't restart.<br>we continue.</div>
  <button class="switch" id="switch">Switch Girl</button>
</aside>

<main>
  <section id="group"></section>
  <section id="view"></section>
</main>
</div>

<nav class="mobileNav glass">
<button data-route="home" class="active">⌂<br>Home</button>
<button data-route="lely">🎀<br>Lely</button>
<button data-route="rand">🐆<br>Rand</button>
<button data-route="renad">🐚<br>Renad</button>
<button data-route="munira">👑<br>Munira</button>
</nav>

<script>
const START=new Date(2026,9,4),DAYS=90;
const P={
 lely:{name:"Lujain",short:"Lely",icon:"🎀",theme:"lely",tag:"pink tennis · café · quiet luxury",quote:"soft discipline, pretty results",bg:"lelyBg",moods:["🎾 tennis mornings","☕ Monaco café","🎀 baby pink"]},
 rand:{name:"Rand",short:"Rand",icon:"🐆",theme:"rand",tag:"navy luxury · burgundy · quiet edge",quote:"consistency looks expensive",bg:"randBg",moods:["🌙 navy nights","🐆 subtle jaguar","🍷 burgundy"]},
 renad:{name:"Renad",short:"Renad",icon:"🐚",theme:"renad",tag:"seafoam · pearls · island girl",quote:"flow, glow, repeat",bg:"renadBg",moods:["🌊 clear water","🫧 pearls","⛵ yacht day"]},
 munira:{name:"Munira",short:"Munira",icon:"👑",theme:"munira",tag:"old money · equestrian · blush gold",quote:"grace with a little power",bg:"muniraBg",moods:["🐎 equestrian","🌸 princess blush","🥂 champagne gold"]}
};
const daily=["Water goal","Movement","Skincare AM","Skincare PM","Protein focus","Tidy 10 min","Sleep routine"];
const weekly=["Hair ritual","Room reset","Plan the week","One self-care appointment","Progress photo"];
const monthly=["Measurements","Progress photos","Monthly reflection","Choose a little reward"];
const moods=["🥰","🙂","😌","😴","🥲"];
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
function nowDay(){return Math.max(0,Math.min(DAYS-1,Math.floor((new Date()-START)/86400000)))}
function dkey(i=nowDay()){let d=new Date(START);d.setDate(d.getDate()+i);return d.toISOString().slice(0,10)}
function widx(){return Math.floor(nowDay()/7)}
function mkey(){let d=new Date();return d.toISOString().slice(0,7)}
function key(t,id,sub,item){return "gc:"+[t,id,sub,item].join("|")}
function done(t,id,sub,item){return localStorage.getItem(key(t,id,sub,item))==="1"}
function setDone(t,id,sub,item,v){localStorage.setItem(key(t,id,sub,item),v?"1":"0")}
function pct(t,id,sub,items){let n=items.filter(x=>done(t,id,sub,x)).length;return Math.round(n/items.length*100)}
function dayPct(id,i=nowDay()){return pct("d",id,dkey(i),daily)}
function weekPct(id){return pct("w",id,"w"+(widx()+1),weekly)}
function monthPct(id){return pct("m",id,mkey(),monthly)}
function adherence(id){let upto=nowDay(),sum=0,n=0;for(let i=0;i<=upto;i++){sum+=dayPct(id,i);n++}sum+=weekPct(id);n++;sum+=monthPct(id);n++;return Math.round(sum/n)}
function streak(id){let s=0;for(let i=nowDay();i>=0;i--){if(dayPct(id,i)>=80)s++;else break}return s}
function perfectDays(id){let n=0;for(let i=0;i<=nowDay();i++)if(dayPct(id,i)===100)n++;return n}
function hearts(p,big=false){let n=Math.round(p/12.5);return '<div class="heart '+(big?'big':'')+'">'+Array.from({length:8},(_,i)=>'<span class="'+(i<n?'on':'')+'">♥</span>').join('')+'</div>'}
function level(a){return a<25?"warming up":a<55?"finding rhythm":a<80?"glowing":a<95?"in her era":"main character"}
function groupStreak(){let s=0;for(let i=nowDay();i>=0;i--){let ok=Object.keys(P).every(id=>dayPct(id,i)>=80);if(ok)s++;else break}return s}
function clubPct(){let a=Object.keys(P).map(adherence);return Math.round(a.reduce((x,y)=>x+y,0)/a.length)}
function todayTogether(){let a=Object.keys(P).map(id=>dayPct(id));return Math.round(a.reduce((x,y)=>x+y,0)/a.length)}
function badgeData(){let ids=Object.keys(P),cons=[...ids].sort((a,b)=>adherence(b)-adherence(a))[0],st=[...ids].sort((a,b)=>streak(b)-streak(a))[0],perf=[...ids].sort((a,b)=>perfectDays(b)-perfectDays(a))[0];return {cons,st,perf}}
function renderGroup(){let c=clubPct(),b=badgeData(),all=Object.keys(P).every(id=>dayPct(id)===100);$("#group").innerHTML='<div class="group glass"><div class="grouphead"><div><div class="eyebrow">OUR GLOW PROGRESS ♡</div><h2>Four girls, one glow club.</h2><p>Overall adherence across daily habits + weekly resets + monthly rituals.</p></div><div class="bigscore">'+hearts(c,true)+'<strong>'+c+'%</strong><small class="sub">club adherence</small></div></div><div class="girls">'+Object.keys(P).map(id=>{let p=P[id],a=adherence(id);return '<button class="girl" data-route="'+id+'"><div class="girltop"><span>'+p.icon+' '+p.short+'</span><strong>'+a+'%</strong></div>'+hearts(a)+'<div class="girlmeta"><span>🔥 '+streak(id)+' day streak</span><span>✦ '+level(a)+'</span></div></button>'}).join('')+'</div><div class="clubstats"><div class="clubstat"><strong>'+todayTogether()+'%</strong><span>today together</span></div><div class="clubstat"><strong>'+groupStreak()+'</strong><span>collective streak</span></div><div class="clubstat"><strong>'+Object.values(P).reduce((n,p,id)=>n,0)+'</strong><span>90 day club</span></div></div><div class="badges"><span class="badge">♡ Most Consistent: <b>'+P[b.cons].short+'</b></span><span class="badge">🔥 Longest Streak: <b>'+P[b.st].short+'</b></span><span class="badge">✨ Perfect Days: <b>'+P[b.perf].short+'</b></span><span class="badge">↗ Biggest Comeback: <b>waiting to crown</b></span></div>'+(all?'<div class="perfect">✨ Perfect Glow Day — all four of you did it ♡</div>':'')+'</div>'}
function home(){let c=clubPct();return '<div class="hero"><div class="heroCard glass"><div class="eyebrow">THE 90-DAY GLOW CLUB</div><h1>Pretty habits.<br>Real progress.</h1><p>A soft, motivating dashboard for the four of you — today first, with streaks, hearts, weekly resets and monthly rituals without turning your life into a spreadsheet.</p><div class="moodshape"></div></div><div class="miniStack"><div class="card glass"><div class="eyebrow">CLUB ENERGY</div><h3>'+c+'% glowing</h3><p class="sub">Every tiny check counts toward the same 90-day story.</p>'+hearts(c,true)+'</div><div class="card glass"><div class="eyebrow">TODAY</div><h3>'+todayTogether()+'% together</h3><p class="sub">Collective streak: 🔥 '+groupStreak()+' days</p></div></div></div><div class="profiles">'+Object.keys(P).map(id=>{let p=P[id],a=adherence(id);return '<article class="profileCard '+p.bg+'" data-route="'+id+'"><div class="tag">'+p.icon+' '+p.tag+'</div><h3>'+p.short+'</h3><div class="score"><span>'+hearts(a)+'</span><b>'+a+'%</b></div></article>'}).join('')+'</div><div class="grid2"><div class="card glass"><div class="sectionTitle"><div><h3>Today at a glance</h3><div class="sub">Day '+(nowDay()+1)+' / 90</div></div><span class="pill">♡ live</span></div><div class="todayCards">'+Object.keys(P).map(id=>'<div class="todayOne"><header><span>'+P[id].icon+' '+P[id].short+'</span><b>'+dayPct(id)+'%</b></header>'+hearts(dayPct(id))+'<small>'+level(adherence(id))+'</small></div>').join('')+'</div></div><div class="card glass"><div class="sectionTitle"><div><h3>This week</h3><div class="sub">small wins compound</div></div></div>'+Object.keys(P).map(id=>'<div class="row"><span>'+P[id].icon+' '+P[id].short+'</span><span>'+hearts(weekAvg(id))+'</span><b>'+weekAvg(id)+'%</b></div>').join('')+'</div></div>'}
function weekAvg(id){let s=widx()*7,e=Math.min(nowDay(),s+6),sum=0,n=0;for(let i=s;i<=e;i++){sum+=dayPct(id,i);n++}return n?Math.round(sum/n):0}
function nextFocus(id){return daily.find(x=>!done("d",id,dkey(),x))||null}
function checkList(t,id,sub,items){return '<div class="checks">'+items.map(item=>'<label class="check"><span>'+item+'</span><input type="checkbox" data-check data-t="'+t+'" data-id="'+id+'" data-sub="'+sub+'" data-item="'+item.replace(/"/g,'&quot;')+'" '+(done(t,id,sub,item)?'checked':'')+'></label>').join('')+'</div>'}
function weekStrip(id){let s=widx()*7;return '<div class="weekstrip">'+Array.from({length:7},(_,j)=>{let i=s+j,p=i<=nowDay()?dayPct(id,i):0,d=new Date(START);d.setDate(d.getDate()+i);return '<div class="daydot '+(i===nowDay()?'today':'')+'"><span>'+["S","M","T","W","T","F","S"][j]+'</span><b>'+p+'%</b></div>'}).join('')+'</div>'}
function profile(id){let p=P[id],a=adherence(id),focus=nextFocus(id),m=localStorage.getItem("gc:mood:"+id+":"+dkey())||"";return '<div class="profileTop"><div class="moodboard glass"><div class="moodTile big '+p.bg+'"><span>'+p.moods[0]+'</span></div><div class="moodTile '+p.bg+'"><span>'+p.moods[1]+'</span></div><div class="moodTile '+p.bg+'"><span>'+p.moods[2]+'</span></div></div><div class="profileInfo glass"><div class="eyebrow">'+p.icon+' PERSONAL WORLD · DAY '+(nowDay()+1)+'</div><h2>'+p.name+'&apos;s<br>corner</h2><p class="sub">'+p.tag+'</p><p style="font:600 20px Cormorant Garamond;margin-top:14px">“'+p.quote+'”</p><div class="adherence"><div><strong>'+a+'%</strong><div class="sub">OVERALL ADHERENCE</div>'+hearts(a,true)+'</div><div class="streaks"><span>🔥 '+streak(id)+' day streak</span><span>♡ '+perfectDays(id)+' perfect days</span><span>✦ '+level(a)+'</span></div></div><div class="profileStats"><div class="stat"><strong>'+dayPct(id)+'%</strong><small>TODAY</small></div><div class="stat"><strong>'+weekPct(id)+'%</strong><small>WEEKLY</small></div><div class="stat"><strong>'+monthPct(id)+'%</strong><small>MONTH</small></div></div></div></div><div class="insights"><div class="insight glass"><div class="eyebrow">TODAY'S FOCUS</div><h3>'+(focus||"Perfect day ♡")+'</h3><p class="sub">'+(focus?"One tiny tap. Keep the momentum soft and simple.":"Every daily habit is checked. Main-character behavior.")+'</p>'+(focus?'<button class="switch" data-focus="'+id+'" data-item="'+focus+'">Mark it done ♡</button>':'')+'</div><div class="insight glass"><div class="eyebrow">CURRENT STREAK</div><h3>🔥 '+streak(id)+' days</h3><p class="sub">A day counts at 80%+ completion.</p>'+weekStrip(id)+'</div><div class="insight glass"><div class="eyebrow">MOOD CHECK-IN</div><h3>How are you?</h3><div class="moods">'+moods.map(x=>'<button data-mood="'+id+'" data-value="'+x+'" class="'+(m===x?'active':'')+'">'+x+'</button>').join('')+'</div></div></div><div class="taskGrid"><div class="card glass"><div class="sectionTitle"><div><h3>Today</h3><div class="sub">'+dkey()+'</div></div><span class="pill">'+dayPct(id)+'%</span></div>'+checkList("d",id,dkey(),daily)+'</div><div class="card glass"><div class="sectionTitle"><div><h3>This week</h3><div class="sub">Week '+(widx()+1)+'</div></div><span class="pill">'+weekPct(id)+'%</span></div>'+checkList("w",id,"w"+(widx()+1),weekly)+'</div><div class="card glass"><div class="sectionTitle"><div><h3>Current month</h3><div class="sub">'+mkey()+'</div></div><span class="pill">'+monthPct(id)+'%</span></div>'+checkList("m",id,mkey(),monthly)+'</div><div class="card glass"><div class="sectionTitle"><div><h3>Glow notes</h3><div class="sub">gentle reminders</div></div></div><div class="row"><span>♡ Most important</span><small>consistency &gt; perfection</small></div><div class="row"><span>✦ Current level</span><small>'+level(a)+'</small></div><div class="row"><span>🔥 Streak rule</span><small>80%+ keeps it alive</small></div></div></div>'}
function route(r){$$("[data-route]").forEach(x=>x.classList.toggle("active",x.dataset.route===r));if(r==="home"){document.body.dataset.theme="club";$("#view").innerHTML=home()}else{document.body.dataset.theme=P[r].theme;$("#view").innerHTML=profile(r)}renderGroup();window.scrollTo({top:0,behavior:"smooth"})}
function toast(){let t=$("#toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),900)}
function showGate(){$("#gate").classList.add("show")}
function hideGate(){$("#gate").classList.remove("show")}
function selectGirl(id){if($("#remember").checked)localStorage.setItem("gc:user",id);else sessionStorage.setItem("gc:user",id);hideGate();route(id)}
document.addEventListener("click",e=>{let p=e.target.closest("[data-pick]");if(p)return selectGirl(p.dataset.pick);let r=e.target.closest("[data-route]");if(r)return route(r.dataset.route);if(e.target.closest("#switch"))return showGate();let f=e.target.closest("[data-focus]");if(f){setDone("d",f.dataset.focus,dkey(),f.dataset.item,true);toast();return route(f.dataset.focus)}let mo=e.target.closest("[data-mood]");if(mo){localStorage.setItem("gc:mood:"+mo.dataset.mood+":"+dkey(),mo.dataset.value);toast();return route(mo.dataset.mood)}});
document.addEventListener("change",e=>{if(!e.target.matches("[data-check]"))return;let x=e.target;setDone(x.dataset.t,x.dataset.id,x.dataset.sub,x.dataset.item,x.checked);toast();route(x.dataset.id)});
function clock(){let d=new Date();$("#clock").textContent=d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});$("#date").textContent=d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});$("#daypill").textContent="Day "+(nowDay()+1)+" / 90"}clock();setInterval(clock,30000);
route("home");let remembered=localStorage.getItem("gc:user")||sessionStorage.getItem("gc:user");if(remembered&&P[remembered])route(remembered);else showGate();
</script>
</body>
</html>
